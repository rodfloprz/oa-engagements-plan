<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Value Drivers &amp; Engagement Roadmap — Grafana Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121317; --bg-2:#0d0e11;
    --surface:#1b1d23; --surface-2:#23262e; --surface-3:#2b2e37;
    --border:#33363f; --border-soft:#282b33;
    --text:#eceef2; --text-dim:#a5aab5; --text-faint:#6d7280;
    --brand:#ff8833;
    --c-tco:#f2a94e; --c-derisk:#4fb0d9; --c-retention:#6fcf7a; --c-ttm:#b58af2;
    --radius:8px; --radius-sm:5px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'Inter',system-ui,-apple-system,Segoe UI,sans-serif; -webkit-font-smoothing:antialiased; line-height:1.5;}
  ::selection{background:var(--brand); color:#1a1200;}
  button{font-family:inherit;}
  h1,h2,h3{margin:0;}

  /* ---------- sticky head ---------- */
  .sticky-head{position:sticky; top:0; z-index:40; background:var(--bg);}
  .topbar{background:linear-gradient(180deg,var(--bg-2) 0%, var(--bg) 100%); border-bottom:1px solid var(--border);}
  .topbar-inner{max-width:1440px; margin:0 auto; padding:14px 24px 12px; display:flex; flex-wrap:wrap; align-items:flex-start; gap:16px;}
  .brand-block{display:flex; align-items:center; gap:10px; margin-right:auto;}
  .brand-mark{width:34px;height:34px;border-radius:9px; background:radial-gradient(120% 120% at 20% 15%, #ffb066 0%, var(--brand) 45%, #c85c00 100%); display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-mark svg{width:18px;height:18px; stroke:#1a0f00; fill:none; stroke-width:2.2; stroke-linecap:round;}
  .brand-title{font-weight:700; font-size:15px;}
  .brand-sub{font-size:12px; color:var(--text-faint); margin-top:1px;}

  .lang-switch{display:flex; border:1px solid var(--border); border-radius:999px; padding:3px; background:var(--surface); flex-shrink:0;}
  .lang-switch button{border:none; background:transparent; color:var(--text-dim); padding:6px 14px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer;}
  .lang-switch button.active{background:var(--brand); color:#1a0f00;}

  .field-row{display:flex; flex-wrap:wrap; gap:12px; width:100%; padding-top:2px;}
  .field{display:flex; flex-direction:column; gap:4px; min-width:150px; flex:1 1 170px;}
  .field label{font-size:11px; color:var(--text-faint); font-weight:600;}
  .field input{background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm); padding:7px 10px; font-size:13px; font-family:inherit;}
  .field input:focus{outline:none; border-color:var(--brand);}
  .field input::placeholder{color:var(--text-faint);}

  /* ---------- step nav ---------- */
  .stepnav-wrap{border-bottom:1px solid var(--border); background:var(--bg);}
  .stepnav{max-width:1440px; margin:0 auto; padding:10px 24px; display:flex; gap:10px; flex-wrap:wrap;}
  .step-btn{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); color:var(--text-dim); padding:9px 16px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer;}
  .step-btn .step-badge{background:var(--surface-3); color:var(--text-dim); font-size:11px; font-weight:700; padding:1px 8px; border-radius:999px;}
  .step-btn.active{background:var(--surface-2); color:var(--text); border-color:var(--brand);}
  .step-btn.active .step-badge{background:var(--brand); color:#1a0f00;}
  .step-arrow{color:var(--text-faint); display:flex; align-items:center; font-size:13px;}

  /* ---------- layout ---------- */
  .layout{max-width:1440px; margin:0 auto; display:grid; grid-template-columns:230px minmax(0,1fr) 300px; gap:20px; padding:20px 24px 60px; align-items:start;}
  @media (max-width:1080px){ .layout{grid-template-columns:1fr;} }

  .rail{display:flex; flex-direction:column; gap:8px; position:sticky; top:186px;}
  @media (max-width:1080px){ .rail{position:static; flex-direction:row; overflow-x:auto; gap:8px; padding-bottom:4px; -webkit-overflow-scrolling:touch;} }
  .rail-tab{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-left:3px solid transparent; border-radius:var(--radius); padding:10px 12px; cursor:pointer; text-align:left; color:var(--text-dim); flex-shrink:0;}
  .rail-tab .rail-icon{width:20px;height:20px; flex-shrink:0;}
  .rail-tab .rail-icon svg{width:20px;height:20px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
  .rail-tab .rail-text{display:flex; flex-direction:column; min-width:0;}
  .rail-tab .rail-name{font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px;}
  .rail-tab .rail-count{font-size:11px; color:var(--text-faint);}
  .rail-tab.active{background:var(--surface-2); color:var(--text);}
  .rail-tab:hover{background:var(--surface-2);}

  .main-col{min-width:0; display:flex; flex-direction:column; gap:16px;}
  .cat-header{display:flex; align-items:flex-start; gap:12px; padding-bottom:2px;}
  .cat-header .swatch{width:6px; border-radius:4px; align-self:stretch; flex-shrink:0; min-height:44px;}
  .cat-header h2{font-size:19px; font-weight:700; margin-bottom:4px;}
  .cat-header p{margin:0; font-size:13px; color:var(--text-dim); max-width:640px;}

  .proof-strip{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:10px 14px; font-size:12px; color:var(--text-faint); line-height:1.6;}
  .proof-strip b{color:var(--text-dim); font-weight:600;}

  .case-list{display:flex; flex-direction:column; gap:10px;}
  .case-card{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--border); border-radius:var(--radius); padding:14px 16px; transition:border-color .18s ease;}
  .case-card.selected{border-left-color:var(--cat-color, var(--brand)); background:var(--surface-2);}
  .case-top{display:flex; align-items:flex-start; gap:10px;}
  .case-check{margin-top:2px; width:18px; height:18px; flex-shrink:0; accent-color:var(--cat-color, var(--brand)); cursor:pointer;}
  .case-name{font-size:14.5px; font-weight:600; cursor:pointer; user-select:none;}
  .case-features{font-size:12.5px; color:var(--text-dim); margin:3px 0 0;}
  .case-desc{font-size:12.5px; color:var(--text-faint); margin:6px 0 0; line-height:1.55;}
  .case-detail{margin-top:12px; padding-top:12px; border-top:1px dashed var(--border-soft); display:flex; flex-direction:column; gap:12px;}
  .detail-block-label{font-size:11px; font-weight:700; color:var(--text-dim);}
  .priority-options{display:flex; gap:6px;}
  .priority-btn{border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim); padding:5px 12px; border-radius:999px; font-size:12px; font-weight:600; cursor:pointer;}
  .priority-btn.on-alta{background:#5a2a1f; border-color:#c0512f; color:#ffcaa8;}
  .priority-btn.on-media{background:#4a4318; border-color:#b89a2f; color:#f3dd9a;}
  .priority-btn.on-baja{background:#26333a; border-color:#3f6672; color:#a9d3df;}
  .kpi-list{display:flex; flex-direction:column; gap:6px;}
  .kpi-item{display:flex; align-items:flex-start; gap:8px; font-size:12.5px; color:var(--text-dim);}
  .kpi-item input{margin-top:2px; accent-color:var(--cat-color, var(--brand)); cursor:pointer;}
  .kpi-item label{cursor:pointer;}
  .notes-area textarea{width:100%; min-height:56px; resize:vertical; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm); padding:8px 10px; font-size:12.5px; font-family:inherit;}
  .notes-area textarea:focus{outline:none; border-color:var(--brand);}
  .empty-state{border:1px dashed var(--border); border-radius:var(--radius); padding:24px; text-align:center; color:var(--text-faint); font-size:13px;}

  /* ---------- engagements view ---------- */
  .eng-intro{display:flex; flex-direction:column; gap:4px; margin-bottom:4px;}
  .eng-intro h2{font-size:19px; font-weight:700;}
  .eng-intro p{margin:0; font-size:13px; color:var(--text-dim); max-width:720px;}

  .rec-banner{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:14px 16px;}
  .rec-banner-title{font-size:13px; font-weight:700; color:var(--text); margin-bottom:10px;}
  .rec-empty{font-size:12.5px; color:var(--text-faint); line-height:1.6;}
  .rec-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:10px;}
  .rec-card{background:var(--surface-2); border:1px solid var(--border); border-left:3px solid var(--rec-color, var(--brand)); border-radius:var(--radius); padding:12px 14px;}
  .rec-card .rec-rank{font-size:10.5px; color:var(--text-faint); font-weight:700;}
  .rec-card .rec-name{font-size:13.5px; font-weight:700; margin:2px 0 6px;}
  .rec-card .rec-phase{font-size:10.5px; color:var(--text-faint); margin-bottom:6px;}
  .rec-card .rec-why{font-size:11.5px; color:var(--text-dim); line-height:1.5;}
  .rec-card .rec-why b{color:var(--text);}

  .found-banner{background:rgba(79,176,217,0.08); border:1px solid rgba(79,176,217,0.3); border-radius:var(--radius); padding:12px 16px; display:flex; gap:10px; align-items:flex-start;}
  .found-banner svg{width:18px;height:18px; stroke:var(--c-derisk); fill:none; stroke-width:1.8; stroke-linecap:round; margin-top:1px; flex-shrink:0;}
  .found-banner-title{font-size:12.5px; font-weight:700; color:var(--text); margin-bottom:3px;}
  .found-banner-text{font-size:12px; color:var(--text-dim); line-height:1.55;}

  .catalog-title{font-size:15px; font-weight:700; margin-top:6px;}
  .catalog-hint{font-size:12px; color:var(--text-faint); margin:2px 0 4px;}

  .phase-section{scroll-margin-top:196px; display:flex; flex-direction:column; gap:10px;}
  .phase-header{display:flex; align-items:center; gap:10px; padding:6px 0 2px;}
  .phase-header .phase-icon{width:22px;height:22px; color:var(--brand); flex-shrink:0;}
  .phase-header .phase-icon svg{width:22px;height:22px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
  .phase-header h3{font-size:15.5px; font-weight:700;}
  .phase-header .phase-count{font-size:11.5px; color:var(--text-faint); margin-left:auto; flex-shrink:0;}

  .eng-card{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--border); border-radius:var(--radius); padding:13px 15px;}
  .eng-card.checked{border-left-color:var(--brand); background:var(--surface-2);}
  .eng-top{display:flex; align-items:flex-start; gap:10px;}
  .eng-check{margin-top:2px; width:18px; height:18px; flex-shrink:0; accent-color:var(--brand); cursor:pointer;}
  .eng-title-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .eng-name{font-size:14px; font-weight:600; cursor:pointer; user-select:none;}
  .status-badge{font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px; flex-shrink:0;}
  .badge-live{background:rgba(111,207,122,0.15); color:#6fcf7a; border:1px solid rgba(111,207,122,0.35);}
  .badge-dev{background:rgba(242,169,78,0.15); color:#f2a94e; border:1px solid rgba(242,169,78,0.35);}
  .badge-planned{background:rgba(165,170,181,0.14); color:#a5aab5; border:1px solid rgba(165,170,181,0.32);}
  .tag-pill{font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px; flex-shrink:0;}
  .tag-fundamental{background:rgba(79,176,217,0.15); color:#4fb0d9; border:1px solid rgba(79,176,217,0.35);}
  .tag-recommended{background:rgba(255,136,51,0.15); color:#ff8833; border:1px solid rgba(255,136,51,0.35);}
  .eng-desc{font-size:12.5px; color:var(--text-faint); margin:6px 0 0; line-height:1.55;}
  .eng-detail-row{display:flex; flex-wrap:wrap; gap:24px; margin-top:10px;}
  .eng-detail-col{flex:1 1 220px; min-width:0;}
  .eng-detail-label{font-size:10.5px; font-weight:700; color:var(--text-dim); margin-bottom:5px;}
  .deliv-list{margin:0; padding-left:16px; font-size:12px; color:var(--text-faint); line-height:1.6;}
  .eng-time{font-size:12px; color:var(--text-faint);}

  /* ---------- summary panel ---------- */
  .summary{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:14px; position:sticky; top:186px;}
  @media (max-width:1080px){ .summary{position:static;} }
  .summary h3{font-size:14px; font-weight:700;}
  .summary-total{display:flex; align-items:baseline; gap:8px;}
  .summary-total .num{font-size:26px; font-weight:800; color:var(--brand); line-height:1;}
  .summary-total .lbl{font-size:11.5px; color:var(--text-dim);}
  .cat-bars{display:flex; flex-direction:column; gap:8px;}
  .cat-bar-row{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--text-dim);}
  .cat-bar-track{flex:1; height:6px; border-radius:4px; background:var(--surface-3); overflow:hidden;}
  .cat-bar-fill{height:100%; border-radius:4px;}
  .cat-bar-count{font-size:11px; color:var(--text-faint); width:34px; text-align:right; flex-shrink:0;}
  .kpi-total{font-size:12px; color:var(--text-dim);}
  .kpi-total b{color:var(--text); font-weight:700;}
  .summary-divider{border-top:1px dashed var(--border-soft);}
  .export-btns{display:flex; flex-direction:column; gap:8px;}
  .btn{border:none; border-radius:var(--radius-sm); padding:10px 14px; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--brand); color:#1a0f00;}
  .btn-secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn svg{width:15px;height:15px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
  .export-hint{font-size:11px; color:var(--text-faint); margin-top:-4px;}
  .reset-link{background:none; border:none; color:var(--text-faint); font-size:11.5px; text-decoration:underline; cursor:pointer; padding:0; text-align:left; width:fit-content;}
  .reset-link:hover{color:var(--text-dim);}
  .cta-link{background:none; border:1px solid var(--border); color:var(--text-dim); font-size:12px; font-weight:600; padding:8px 12px; border-radius:var(--radius-sm); cursor:pointer; text-align:center;}
  .cta-link:hover{border-color:var(--brand); color:var(--text);}
  .autosave-note{font-size:10.5px; color:var(--text-faint); display:flex; align-items:center; gap:5px;}
  .autosave-dot{width:6px;height:6px;border-radius:50%;background:var(--c-retention);flex-shrink:0;}
  .footer-note{max-width:1440px; margin:0 auto; padding:0 24px 40px; font-size:11px; color:var(--text-faint); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

  @media (max-width:640px){
    .topbar-inner{padding:12px 16px 10px;}
    .stepnav{padding:10px 16px;}
    .layout{padding:16px 16px 50px;}
    .footer-note{padding:0 16px 30px;}
  }
</style>
</head>
<body>

<div class="sticky-head">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand-block">
        <div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M4 20V10M12 20V4M20 20v-7"/></svg></div>
        <div>
          <div class="brand-title" id="txt-app-title">Value Drivers &amp; Engagement Roadmap</div>
          <div class="brand-sub" id="txt-app-sub">Correlaciona tus prioridades de negocio con el roadmap de engagements</div>
        </div>
      </div>
      <div class="lang-switch" role="group" aria-label="Idioma">
        <button type="button" id="lang-es" onclick="setLang('es')">ES</button>
        <button type="button" id="lang-en" onclick="setLang('en')">EN</button>
      </div>
      <div class="field-row">
        <div class="field"><label id="lbl-client" for="in-client">Cliente / Cuenta</label><input id="in-client" type="text" oninput="onChromeInput('client', this.value)"></div>
        <div class="field"><label id="lbl-contact" for="in-contact">Contacto principal</label><input id="in-contact" type="text" oninput="onChromeInput('contact', this.value)"></div>
        <div class="field"><label id="lbl-prepared" for="in-prepared">Preparado por</label><input id="in-prepared" type="text" oninput="onChromeInput('preparedBy', this.value)"></div>
        <div class="field"><label id="lbl-date" for="in-date">Fecha</label><input id="in-date" type="date" oninput="onChromeInput('date', this.value)"></div>
      </div>
    </div>
  </div>
  <div class="stepnav-wrap">
    <div class="stepnav" id="stepnav"></div>
  </div>
</div>

<div class="layout">
  <nav class="rail" id="rail"></nav>
  <div class="main-col" id="main-col"></div>
  <aside class="summary" id="summary"></aside>
</div>

<div class="footer-note">
  <span id="txt-footer">Herramienta interna de Grafana Labs para talleres de alineación de value drivers y engagements.</span>
  <span class="autosave-note"><span class="autosave-dot"></span><span id="txt-autosaved">Progreso guardado en este navegador</span></span>
</div>

<script>
/* =========================================================
   ICONS
   ========================================================= */
const ICONS = {
  tco: '<path d="M12 3.5c4 0 7 1.4 7 3.2S16 10 12 10s-7-1.5-7-3.3 3-3.2 7-3.2z"/><path d="M5 6.7v5.5c0 1.8 3.1 3.3 7 3.3s7-1.5 7-3.3V6.7"/><path d="M5 12.2v5.4c0 1.8 3.1 3.3 7 3.3s7-1.5 7-3.3v-5.4"/>',
  derisk: '<path d="M12 3l7 3.1v5.4c0 5.2-3.6 8.4-7 9.5-3.4-1.1-7-4.3-7-9.5V6.1L12 3z"/><path d="M9 12.2l2.1 2.1 3.9-4.3"/>',
  retention: '<path d="M4.5 12A7.5 7.5 0 0 1 18 6.6M19.5 12A7.5 7.5 0 0 1 6 17.4"/><path d="M17.6 3.8v3.4h-3.4"/><path d="M6.4 20.2v-3.4h3.4"/>',
  ttm: '<path d="M12 2.3c2.8 1.9 4.6 5.6 4.6 9.3 0 1.9-.9 3.7-1.9 4.7l-2.7 2.6-2.7-2.6c-1-1-1.9-2.8-1.9-4.7 0-3.7 1.8-7.4 4.6-9.3z"/><path d="M8.6 15.6l-2.4 2.4M15.4 15.6l2.4 2.4"/><circle cx="12" cy="10.5" r="1.4"/>',
  p1: '<circle cx="10" cy="10" r="6.3"/><path d="M14.7 14.7L20 20"/>',
  p2: '<path d="M4 16l5-6 4 4 7-8"/><path d="M20 6h-5.5v5.5"/>',
  p3: '<path d="M12 3.5l9 4.7-9 4.7-9-4.7 9-4.7z"/><path d="M6.5 10.2v5c0 1.4 2.6 2.7 5.5 2.7s5.5-1.3 5.5-2.7v-5"/>',
  p4: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.2"/><circle cx="12" cy="12" r="0.7" fill="currentColor"/>',
  tactical: '<path d="M13 2 5 14h6l-1 8 9-12h-6l1-8z"/>',
  bulb: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3 11.2c.6.4 1 1 1 1.8v0h4v0c0-.8.4-1.4 1-1.8A6 6 0 0 0 12 3z"/>'
};

/* =========================================================
   VALUE DRIVERS DATA
   ========================================================= */
const DATA = [
  {
    id:'tco', color:'var(--c-tco)', colorHex:'#f2a94e', icon:ICONS.tco,
    title:{es:'Lower TCO — Reducir el Costo Total de Propiedad', en:'Lower TCO — Reduce Total Cost of Ownership'},
    sub:{es:'Cómo bajar el costo total de la observabilidad sin perder cobertura.', en:'How to lower the total cost of observability without losing coverage.'},
    proof:{es:'Iron Mountain (-43% TCO · $640K ahorros/año · 2 FTEs liberados) · The Trade Desk (~$1.74M/año) · ASOS (-30% costos) · SpotOn (-70% costos vs. Datadog)', en:'Iron Mountain (-43% TCO · $640K savings/year · 2 FTEs freed) · The Trade Desk (~$1.74M/year) · ASOS (-30% costs) · SpotOn (-70% costs vs. Datadog)'},
    cases:[
      { id:'tco-1', name:{es:'Consolidación de herramientas', en:'Tool consolidation'}, features:{es:'Reemplazar múltiples plataformas (Datadog, Splunk, New Relic, etc.) con una sola', en:'Replace multiple platforms (Datadog, Splunk, New Relic, etc.) with a single one'}, desc:{es:'El cliente opera con 5–10+ herramientas de monitoreo distintas, generando costos duplicados, fatiga operacional y brechas de visibilidad. Grafana consolida todo en una sola plataforma con precios basados en uso, no por asiento.', en:'The client operates with 5\u201310+ different monitoring tools, generating duplicated costs, operational fatigue, and visibility gaps. Grafana consolidates everything into a single platform with usage-based pricing, not per-seat.'}, kpis:[{es:'Nº de herramientas antes vs. después', en:'Number of tools before vs. after'},{es:'Ahorro anual en licencias ($)', en:'Annual license savings ($)'}] },

let STATE = {

function loadState(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); if(raw){ STATE = Object.assign(STATE, JSON.parse(raw)); } }catch(e){}
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){} }
function getSel(caseId){ if(!STATE.selections[caseId]) STATE.selections[caseId] = { selected:false, priority:null, kpis:{}, notes:'' }; return STATE.selections[caseId]; }

loadState();

function onChromeInput(key, value){ STATE[key] = value; saveState(); }

function setLang(lang){ STATE.lang = lang; saveState(); renderChrome(); render(); }
function setView(view){ STATE.view = view; render(); }
function setActiveCat(id){ STATE.activeCat = id; render(); }

function toggleCase(caseId){
  const sel = getSel(caseId);
  sel.selected = !sel.selected;
  if(sel.selected && !sel.priority) sel.priority = 'media';
  if(sel.selected){
    const found = findCase(caseId);
    found.cs.kpis.forEach((_, i) => { if(sel.kpis[i] === undefined) sel.kpis[i] = true; });
  }
  saveState(); render();
}
function setPriority(caseId, priority){ getSel(caseId).priority = priority; saveState(); render(); }
function toggleKpi(caseId, idx){ const sel = getSel(caseId); sel.kpis[idx] = !sel.kpis[idx]; saveState(); render(); }
function onNotesInput(caseId, value){ getSel(caseId).notes = value; saveState(); }

function isFoundational(engId){ const e = ENGAGEMENTS[engId]; return !!(e && e.foundational); }
function isEngagementChecked(engId){
  if(STATE.engagementSelections[engId] !== undefined) return STATE.engagementSelections[engId];
  return isFoundational(engId) || computeTop3().includes(engId);
}
function toggleEngagement(engId){
  STATE.engagementSelections[engId] = !isEngagementChecked(engId);
  saveState(); render();
}

function resetAll(){
  const t = STR[STATE.lang];
  if(!confirm(t.resetConfirm)) return;
  STATE.selections = {}; STATE.engagementSelections = {};
  saveState(); render();
}

/* =========================================================
   COMPUTED HELPERS
   ========================================================= */
function countSelectedInCat(cat){ return cat.cases.filter(cs => getSel(cs.id).selected).length; }
function totalSelectedDrivers(){ return DATA.reduce((s,c) => s + countSelectedInCat(c), 0); }
function totalCases(){ return DATA.reduce((s,c) => s + c.cases.length, 0); }
function totalKpisConfirmed(){
  let n = 0;
  DATA.forEach(cat => cat.cases.forEach(cs => { const sel = STATE.selections[cs.id]; if(sel && sel.selected){ cs.kpis.forEach((_,i) => { if(sel.kpis[i]) n++; }); } }));
  return n;
}
function anyDriverSelected(){ return DATA.some(cat => cat.cases.some(cs => getSel(cs.id).selected)); }

function computeEngagementScores(){
  const scores = {};
  DATA.forEach(cat => cat.cases.forEach(cs => {
    const sel = STATE.selections[cs.id];
    if(sel && sel.selected){
      const w = PRIORITY_WEIGHT[sel.priority] || 2;
      (MAPPING[cs.id] || []).forEach(engId => { scores[engId] = (scores[engId] || 0) + w; });
    }
  }));
  return scores;
}
function computeTop3(){
  const scores = computeEngagementScores();
  return Object.entries(scores).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]).slice(0,3).map(([id]) => id);
}
function computeRationale(engId){
  const items = [];
  DATA.forEach(cat => cat.cases.forEach(cs => {
    const sel = STATE.selections[cs.id];
    if(sel && sel.selected && (MAPPING[cs.id] || []).includes(engId)){
      items.push({ name: cs.name, priority: sel.priority, weight: PRIORITY_WEIGHT[sel.priority] || 2, catColor: cat.color });
    }
  }));
  items.sort((a,b) => b.weight - a.weight);
  return items;
}
function dominantCatColor(engId){
  const rat = computeRationale(engId);
  return rat.length ? rat[0].catColor : 'var(--brand)';
}
function countSelectedEngagementsInPhase(phase){ return phase.engIds.filter(id => isEngagementChecked(id)).length; }
function totalEngagementsSelected(){ return PHASES.reduce((s,p) => s + countSelectedEngagementsInPhase(p), 0); }
function totalEngagements(){ return PHASES.reduce((s,p) => s + p.engIds.length, 0); }

function legacyDownload(filename, blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* When this page runs as a published Claude artifact, plain browser
   downloads are inert, so we offer the file through the platform's
   "downloads" capability instead. When this page runs as a plain local
   HTML file (window.claude does not exist there), we fall back to the
   ordinary Blob+<a download> approach, so the same file keeps working
   in both places. */
async function offerDownload(filename, blob){
  if(window.claude && typeof window.claude.use === 'function'){
    try{
      const downloads = await window.claude.use('downloads');
      if(downloads){
        try{
          await downloads.save({ filename, data: blob });
        }catch(err){
          if(err && err.code === 'declined') return;
          alert(STATE.lang === 'es'
            ? 'No se pudo guardar el archivo en este visor. Intenta de nuevo.'
            : 'Could not save the file in this viewer. Please try again.');
        }
        return;
      }
    }catch(e){ /* capability unavailable, fall through to legacy path */ }
  }
  legacyDownload(filename, blob);
}

async function downloadBlob(filename, mime, content){
  const blob = new Blob([content], { type: mime });
  await offerDownload(filename, blob);
}

async function buildAndSaveMarkdown(){
  const t = STR[STATE.lang];
  const lang = STATE.lang;
  const priorityLabel = { alta:t.priorityAlta, media:t.priorityMedia, baja:t.priorityBaja };

  let md = '';
  md += lang === 'es' ? `# Grafana — Value Drivers & Roadmap de Engagements\n\n` : `# Grafana — Value Drivers & Engagement Roadmap\n\n`;
  md += `**${t.client}:** ${STATE.client || '—'}\n`;
  md += `**${t.contact}:** ${STATE.contact || '—'}\n`;
  md += `**${t.prepared}:** ${STATE.preparedBy || '—'}\n`;
  md += `**${t.date}:** ${STATE.date || '—'}\n\n`;

  md += (lang === 'es' ? `## Resumen\n` : `## Summary\n`);
  md += `- ${lang === 'es' ? 'Value drivers seleccionados' : 'Value drivers selected'}: ${totalSelectedDrivers()}/${totalCases()}\n`;
  md += `- ${t.kpiTotal}: ${totalKpisConfirmed()}\n`;
  md += `- ${lang === 'es' ? 'Engagements seleccionados' : 'Engagements selected'}: ${totalEngagementsSelected()}/${totalEngagements()}\n\n`;

  md += lang === 'es' ? `## 1. Value Drivers\n\n` : `## 1. Value Drivers\n\n`;
  const dRows = buildDriverReportRows();
  if(!dRows.length){
    md += lang === 'es' ? '_Aún no se seleccionaron casos de uso._\n\n' : '_No use cases selected yet._\n\n';
  }
  dRows.forEach(({ cat, selectedCases }) => {
    md += `### ${cat.title[lang]} (${selectedCases.length}/${cat.cases.length})\n\n`;
    selectedCases.forEach(cs => {
      const sel = getSel(cs.id);
      const prio = sel.priority ? priorityLabel[sel.priority] : '—';
      md += `**${cs.name[lang]}** — ${t.priorityQ} ${prio}\n\n`;
      md += `${lang === 'es' ? 'Características' : 'Features'}: ${cs.features[lang]}\n\n`;
      const confirmedKpis = cs.kpis.filter((_, i) => sel.kpis[i]);
      if(confirmedKpis.length){
        md += `${t.kpisLabel}:\n`;
        confirmedKpis.forEach(k => md += `- ${k[lang]}\n`);
        md += `\n`;
      }
      if(sel.notes && sel.notes.trim()) md += `${lang === 'es' ? 'Notas' : 'Notes'}: ${sel.notes.trim()}\n\n`;
    });
  });

  md += lang === 'es' ? `## 2. Roadmap de Engagements\n\n` : `## 2. Engagement Roadmap\n\n`;
  const top3 = computeTop3();
  if(anyDriverSelected() && top3.length){
    md += lang === 'es' ? `### Recomendados según los Value Drivers seleccionados\n\n` : `### Recommended based on the selected Value Drivers\n\n`;
    top3.forEach((engId, i) => {
      const eng = findEngagement(engId);
      const rationale = computeRationale(engId);
      const whyText = rationale.map(r => `${r.name[lang]} (${priorityLabel[r.priority] || r.priority})`).join(', ');
      md += `${i + 1}. **${eng.name[lang]}** — ${t.recWhy} ${whyText}\n`;
    });
    md += `\n`;
  }

  const eRows = buildEngagementReportRows();
  if(!eRows.length){
    md += lang === 'es' ? '_No se seleccionaron engagements._\n\n' : '_No engagements selected._\n\n';
  }
  eRows.forEach(({ phase, selectedEngs }) => {
    md += `### ${phase.title[lang]}\n\n`;
    selectedEngs.forEach(eng => {
      const tag = isFoundational(eng.id) ? ` [${t.tagFoundational}]` : (top3.includes(eng.id) ? ` [${t.tagRecommended}]` : '');
      const status = eng.status ? ` — ${STATUS_LABELS[eng.status][lang]}` : '';
      md += `**${eng.name[lang]}${tag}${status}**\n\n`;
      md += `${eng.desc[lang]}\n\n`;
      md += `${t.deliverablesLabel}:\n`;
      eng.deliverables[lang].forEach(d => md += `- ${d}\n`);
      md += `\n${t.estTimeLabel}: ${eng.time[lang]}\n\n---\n\n`;
    });
  });

  md += lang === 'es'
    ? `_Generado con la herramienta interactiva de Value Drivers & Engagement Roadmap — Grafana Labs._\n`
    : `_Generated with the interactive Value Drivers & Engagement Roadmap tool — Grafana Labs._\n`;

  const filenameClient = (STATE.client || (lang === 'es' ? 'cliente' : 'client')).replace(/[^a-z0-9]+/gi, '-').toLowerCase();
  await downloadBlob(`grafana-roadmap-${filenameClient}.md`, 'text/markdown;charset=utf-8', md);
}

function loadScript(src){
  return new Promise((resolve, reject) => {
    if(document.querySelector(`script[src="${src}"]`)){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = () => resolve(); s.onerror = () => reject(new Error('load failed: ' + src));
    document.head.appendChild(s);
  });
}
async function ensureJsPdf(){ if(window.jspdf) return; await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'); }
function hexToRgb(hex){ hex = hex.replace('#',''); const n = parseInt(hex,16); return [(n>>16)&255,(n>>8)&255,n&255]; }

async function exportPdf(){
  const btn = document.getElementById('btn-pdf');
  const originalLabel = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = STATE.lang === 'es' ? 'Generando…' : 'Generating…';
  try{ await ensureJsPdf(); await buildPdf(); }
  catch(e){
    alert(STATE.lang === 'es'
      ? 'No se pudo generar el PDF (revisa tu conexión a internet e inténtalo de nuevo).'
      : 'Could not generate the PDF (check your internet connection and try again).');
  }finally{ btn.disabled = false; btn.innerHTML = originalLabel; }
}

async function buildPdf(){
  const t = STR[STATE.lang];
  const lang = STATE.lang;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const marginX = 48;
  const contentW = pageW - marginX * 2;
  let y = 56;

  const brand = hexToRgb('#ff8833');
  const dim = [110,116,128];
  const dark = [30,32,38];
  const priorityLabel = { alta:t.priorityAlta, media:t.priorityMedia, baja:t.priorityBaja };

  function newPageIfNeeded(h){ if(y + h > pageH - 56){ doc.addPage(); y = 56; } }
  function text(str, x, size, weight, color, maxWidth, lineHeight){
    doc.setFont('helvetica', weight || 'normal');
    doc.setFontSize(size);
    doc.setTextColor(color[0], color[1], color[2]);
    const lines = maxWidth ? doc.splitTextToSize(str, maxWidth) : [str];
    const lh = lineHeight || size * 1.35;
    lines.forEach(line => { newPageIfNeeded(lh); doc.text(line, x, y); y += lh; });
    return lines.length * lh;
  }
  function sectionDivider(){
    newPageIfNeeded(20);
    doc.setDrawColor(220,220,220);
    doc.line(marginX, y, pageW - marginX, y);
    y += 16;
  }

  // Header
  doc.setFillColor(brand[0], brand[1], brand[2]);
  doc.rect(marginX, y - 14, 5, 16, 'F');
  text(lang === 'es' ? 'Grafana — Value Drivers & Roadmap de Engagements' : 'Grafana — Value Drivers & Engagement Roadmap', marginX + 14, 16, 'bold', dark);
  y += 4;
  text(`${t.client}: ${STATE.client || '—'}    ${t.contact}: ${STATE.contact || '—'}`, marginX, 10, 'normal', dim, contentW);
  text(`${t.prepared}: ${STATE.preparedBy || '—'}    ${t.date}: ${STATE.date || '—'}`, marginX, 10, 'normal', dim, contentW);
  y += 6;
  sectionDivider();

  // Summary
  text(lang === 'es' ? 'Resumen' : 'Summary', marginX, 13, 'bold', dark);
  y += 2;
  text(`${lang === 'es' ? 'Value drivers seleccionados' : 'Value drivers selected'}: ${totalSelectedDrivers()}/${totalCases()}   ${t.kpiTotal}: ${totalKpisConfirmed()}   ${lang === 'es' ? 'Engagements' : 'Engagements'}: ${totalEngagementsSelected()}/${totalEngagements()}`, marginX, 10.5, 'normal', dim, contentW);
  y += 16;

  // Section 1: Value Drivers
  text(lang === 'es' ? '1. Value Drivers' : '1. Value Drivers', marginX, 13.5, 'bold', dark);
  y += 4;
  const dRows = buildDriverReportRows();
  if(!dRows.length){
    text(lang === 'es' ? 'Aún no se seleccionaron casos de uso.' : 'No use cases selected yet.', marginX, 11, 'italic', dim, contentW);
  }
  dRows.forEach(({ cat, selectedCases }) => {
    newPageIfNeeded(30);
    const catRgb = hexToRgb(cat.colorHex);
    doc.setFillColor(catRgb[0], catRgb[1], catRgb[2]);
    doc.circle(marginX + 4, y - 4, 4, 'F');
    text(`${cat.title[lang]}  (${selectedCases.length}/${cat.cases.length})`, marginX + 16, 12, 'bold', dark, contentW - 16);
    y += 3;
    selectedCases.forEach(cs => {
      const sel = getSel(cs.id);
      const prio = sel.priority ? priorityLabel[sel.priority] : '—';
      newPageIfNeeded(28);
      text(`•  ${cs.name[lang]}  —  ${t.priorityQ} ${prio}`, marginX + 10, 11, 'bold', dark, contentW - 10);
      text(`${lang === 'es' ? 'Características' : 'Features'}: ${cs.features[lang]}`, marginX + 18, 9.5, 'normal', dim, contentW - 18);
      const confirmedKpis = cs.kpis.filter((_, i) => sel.kpis[i]);
      if(confirmedKpis.length){
        text(`${t.kpisLabel}:`, marginX + 18, 9.5, 'bold', dark, contentW - 18);
        confirmedKpis.forEach(k => text(`- ${k[lang]}`, marginX + 24, 9.5, 'normal', dim, contentW - 24));
      }
      if(sel.notes && sel.notes.trim()) text(`${lang === 'es' ? 'Notas' : 'Notes'}: ${sel.notes.trim()}`, marginX + 18, 9.5, 'italic', dim, contentW - 18);
      y += 5;
    });
    y += 6;
  });

  y += 4;
  sectionDivider();

  // Section 2: Engagements
  text(lang === 'es' ? '2. Roadmap de Engagements' : '2. Engagement Roadmap', marginX, 13.5, 'bold', dark);
  y += 4;

  const top3 = computeTop3();
  if(anyDriverSelected() && top3.length){
    text(lang === 'es' ? 'Recomendados según los Value Drivers seleccionados:' : 'Recommended based on the selected Value Drivers:', marginX, 10.5, 'bold', dark, contentW);
    top3.forEach((engId, i) => {
      const eng = findEngagement(engId);
      const rationale = computeRationale(engId);
      const whyText = rationale.map(r => `${r.name[lang]} (${priorityLabel[r.priority] || r.priority})`).join(', ');
      text(`${i + 1}. ${eng.name[lang]} — ${t.recWhy} ${whyText}`, marginX + 6, 9.5, 'normal', dim, contentW - 6);
    });
    y += 8;
  }

  const eRows = buildEngagementReportRows();
  if(!eRows.length){
    text(lang === 'es' ? 'No se seleccionaron engagements.' : 'No engagements selected.', marginX, 11, 'italic', dim, contentW);
  }
  eRows.forEach(({ phase, selectedEngs }) => {
    newPageIfNeeded(28);
    text(phase.title[lang], marginX, 12, 'bold', dark, contentW);
    y += 2;
    selectedEngs.forEach(eng => {
      newPageIfNeeded(30);
      const tag = isFoundational(eng.id) ? ` [${t.tagFoundational}]` : (top3.includes(eng.id) ? ` [${t.tagRecommended}]` : '');
      const status = eng.status ? `  ·  ${STATUS_LABELS[eng.status][lang]}` : '';
      text(`•  ${eng.name[lang]}${tag}${status}`, marginX + 10, 11, 'bold', dark, contentW - 10);
      text(eng.desc[lang], marginX + 18, 9.5, 'normal', dim, contentW - 18);
      text(`${t.deliverablesLabel}:`, marginX + 18, 9, 'bold', dark, contentW - 18);
      eng.deliverables[lang].forEach(d => text(`- ${d}`, marginX + 24, 9, 'normal', dim, contentW - 24));
      text(`${t.estTimeLabel}: ${eng.time[lang]}`, marginX + 18, 9, 'italic', dim, contentW - 18);
      y += 6;
    });
    y += 4;
  });

  // Footer
  const pageCount = doc.internal.getNumberOfPages();
  for(let i = 1; i <= pageCount; i++){
    doc.setPage(i);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(150,150,150);
    doc.text(`${STATE.preparedBy || 'Grafana Labs'} · ${STATE.date || ''}`, marginX, pageH - 28);
    doc.text(String(i) + ' / ' + pageCount, pageW - marginX - 24, pageH - 28);
  }

  const filenameClient = (STATE.client || (lang === 'es' ? 'cliente' : 'client')).replace(/[^a-z0-9]+/gi, '-').toLowerCase();
  const blob = doc.output('blob');
  await offerDownload(`grafana-roadmap-${filenameClient}.pdf`, blob);
}

/* =========================================================
   BOOT
   ========================================================= */
renderChrome();
render();
</script>
</body>
</html>
